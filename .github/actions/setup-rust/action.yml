name: setup rust
description: Restore the pinned rustup toolchain and Rust dependency cache for Rust jobs.
inputs:
  cache-save:
    description: Save both caches on the main-branch writer job.
    default: "false"
  install-toolchain:
    description: Install the pinned toolchain on bare runners, not image-backed jobs.
    default: "true"
runs:
  using: composite
  steps:
    - id: rustup-restore
      if: ${{ inputs.install-toolchain == 'true' }}
      name: restore rustup toolchain
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.rustup/toolchains/*
        key: rustup-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
    - name: install pinned Rust toolchain and components
      if: ${{ inputs.install-toolchain == 'true' }}
      run: rustup toolchain install
      shell: bash
    - name: verify rustup Cargo proxies before mise
      if: ${{ inputs.install-toolchain == 'true' }}
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Windows ]; then
          cargo_home="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")"
          extension=.exe
        else
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          extension=
        fi
        bin="$cargo_home/bin"
        if [ ! -x "$bin/cargo$extension" ] || [ ! -x "$bin/rustc$extension" ]; then
          echo "rustup cargo/rustc proxies missing in $bin" >&2
          exit 1
        fi
    - name: save rustup toolchain
      if: ${{ inputs.install-toolchain == 'true' && inputs.cache-save == 'true' && steps.rustup-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.rustup/toolchains/*
        key: ${{ steps.rustup-restore.outputs.cache-primary-key }}
    - name: cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        prefix-key: moveref-v1-rust-deps
        shared-key: rust-deps
        cache-workspace-crates: "true"
        cache-on-failure: "false"
        save-if: ${{ inputs.cache-save == 'true' }}
