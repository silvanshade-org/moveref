# <critical>
# MUST preserve anchor-first CI: maximal sharing, no copied orchestration.
# New functionality MUST reuse template anchors or add anchors for likely reuse.
# Share setup through actions; preserve parallelism, caches, and gate commands.
# </critical>
name: ci

on:
  push:
    branches: [main]
  # Stacked reviews may target their parent branch rather than main.
  pull_request: {}
  merge_group:
  # Preview a published image before the owner activates the repository switch.
  workflow_dispatch:
    inputs:
      ci_image:
        description: Published pinned GHCR image for a one-run pull check
        required: false
        type: string

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Tools for local editing, indexing, and hook/workflow lint are not used in container gates.
  # Keep identical to the Dockerfile's image build environment.
  MISE_DISABLE_TOOLS: github:colbymchenry/codegraph,github:max-sixty/worktrunk,github:cli/cli,github:j178/prek,github:nektos/act,github:woodruffw/zizmor,npm:@commitlint/cli

permissions:
  contents: read

jobs:
  template:
    if: false
    runs-on: &linux ubuntu-24.04
    permissions: &image-read-permissions
      contents: read
      packages: read
    steps:
      - &checkout
        name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &checkout-history
        name: checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - &setup-rust
        name: set up pinned Rust toolchain and cache
        # This local action comes from the checked-out branch.
        uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          install-toolchain: ${{ needs.image-ref.outputs.image == '' || runner.os != 'Linux' }}
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.job == 'rust-test' }}
      - &setup-mise
        name: set up pinned tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: "2026.9.14"
          install: ${{ needs.image-ref.outputs.image == '' || runner.os != 'Linux' }}
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.job == 'rust-test' }}

  image-ref:
    runs-on: *linux
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - id: ref
        name: relay optional prebuilt image to container jobs
        env:
          MOVEREF_CI_IMAGE: ${{ inputs.ci_image || vars.MOVEREF_CI_IMAGE }}
        run: echo "image=$MOVEREF_CI_IMAGE" >> "$GITHUB_OUTPUT"

  changes:
    runs-on: *linux
    outputs:
      rust: ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.filter.outcome != 'success' || steps.filter.outputs.rust == 'true' }}
    steps:
      - *checkout-history
      - id: filter
        if: github.event_name != 'merge_group' && github.event_name != 'workflow_dispatch'
        name: retain Rust gates for source and workflow changes
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --name-only --no-renames "$BASE_SHA" HEAD | jq -R -s -r 'split("\n") | any(.[]; test("^(src/|tests/|\\.github/|\\.config/|\\.mise/|Cargo\\.|mise\\.|rust-toolchain\\.toml$|rustfmt\\.toml$)")) | "rust=\(.)"' >> "$GITHUB_OUTPUT"

  rust-test:
    needs: [image-ref, changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: *linux
    # Only the repository owner configures the image reference.
    container: ${{ needs.image-ref.outputs.image }} # zizmor: ignore[unpinned-images]
    permissions: *image-read-permissions
    steps:
      - *checkout
      - *setup-rust
      - *setup-mise
      - name: build all targets and the no-std configuration
        run: mise run check:build
      - name: run lifecycle tests and doctests
        run: mise run check:test

  rust-quality:
    needs: [image-ref, changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: *linux
    container: ${{ needs.image-ref.outputs.image }} # zizmor: ignore[unpinned-images]
    permissions: *image-read-permissions
    steps:
      - *checkout
      - *setup-rust
      - *setup-mise
      - name: enforce the strict Clippy wall
        run: mise run check:clippy
      - name: check public and private rustdoc
        run: mise run check:doc

  rust-dependencies:
    needs: [image-ref, changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: *linux
    container: ${{ needs.image-ref.outputs.image }} # zizmor: ignore[unpinned-images]
    permissions: *image-read-permissions
    steps:
      - *checkout
      - *setup-rust
      - *setup-mise
      - name: check bans, licenses, and registry sources
        run: mise run check:deny
      - name: report dependency advisories
        continue-on-error: true
        run: mise exec -- cargo deny check advisories

  rust-miri:
    needs: [image-ref, changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: *linux
    container: ${{ needs.image-ref.outputs.image }} # zizmor: ignore[unpinned-images]
    permissions: *image-read-permissions
    steps:
      - *checkout
      - *setup-rust
      - *setup-mise
      - name: interpret the complete lifecycle test suite
        run: mise run check:miri

  cross-os-test:
    needs: [image-ref, changes]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *setup-rust
      # The formatter is checked on Linux and has no Windows release asset.
      - name: skip unavailable Windows formatter
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: echo "MISE_DISABLE_TOOLS=${MISE_DISABLE_TOOLS},github:numtide/treefmt" >> "$GITHUB_ENV"
      - *setup-mise
      - name: run platform lifecycle tests and doctests
        run: mise run check:test

  format:
    needs: image-ref
    runs-on: *linux
    container: ${{ needs.image-ref.outputs.image }} # zizmor: ignore[unpinned-images]
    permissions: *image-read-permissions
    steps:
      - *checkout-history
      # The checkout's git trust entry is in the runner, not the container.
      - name: trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - *setup-rust
      - *setup-mise
      - name: refuse unresolved conflict markers
        run: mise run check:conflict-markers
      - name: verify the pinned guidance baseline
        run: mise run check:baseline-hash
      - name: verify formatting and size budgets
        run: mise run check:format

  workflow-lint:
    runs-on: *linux
    steps:
      - *checkout
      - name: install pinned workflow auditor
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: zizmor@1.30.1
      - name: audit hosted workflows
        run: zizmor .github/workflows
