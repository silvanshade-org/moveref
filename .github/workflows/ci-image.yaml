# <critical>
# MUST preserve anchor-first CI: share checkout, login, and buildx setup.
# Keep native amd64 and arm64 builds parallel and publish by digest.
# </critical>
name: ci-image

on:
  push:
    branches: [main]
    paths:
      - mise.toml
      - mise.lock
      - rust-toolchain.toml
      - .github/docker/ci.Dockerfile
      - .github/workflows/ci-image.yaml
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  template:
    if: false
    runs-on: &linux ubuntu-latest
    permissions: &image-permissions
      contents: read
      packages: write
    steps:
      - &checkout
        name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &registry-login
        name: authenticate GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - &setup-buildx
        name: set up buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

  pin:
    runs-on: *linux
    outputs:
      tag: ${{ steps.hash.outputs.tag }}
    steps:
      - *checkout
      - id: hash
        name: hash pinned tool inputs
        run: echo "tag=$(cat mise.toml mise.lock rust-toolchain.toml | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  build:
    needs: pin
    runs-on: ${{ matrix.runner }}
    permissions: *image-permissions
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - *checkout
      - *registry-login
      - *setup-buildx
      - id: build
        name: build and push native image by digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: .github/docker/ci.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}-ci,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.arch }}
      - name: save digest for manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: printf '%s' "$DIGEST" > "$RUNNER_TEMP/digest-$ARCH"
      - name: upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: [pin, build]
    runs-on: *linux
    permissions: *image-permissions
    steps:
      - *registry-login
      - *setup-buildx
      - name: download native digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - name: publish image for both platforms
        env:
          IMAGE: ghcr.io/${{ github.repository }}-ci
          TAG: ${{ needs.pin.outputs.tag }}
        run: docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:latest" "$IMAGE@$(cat "$RUNNER_TEMP/digests/digest-amd64")" "$IMAGE@$(cat "$RUNNER_TEMP/digests/digest-arm64")"
