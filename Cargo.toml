[package]
name = "moveref"
version = "1.0.0"
edition = "2024"
description = "Types and traits for safe C++ style placement initialization and move semantics"
documentation = "https://docs.rs/moveref"
repository = "https://github.com/silvanshade-org/moveref"
license = "Apache-2.0 WITH LLVM-exception"
keywords = ["C++", "allocation", "ffi", "memory", "references"]
categories = ["compilers", "external-ffi-bindings", "memory-management", "no-std", "rust-patterns"]

[workspace]
members = ["crates/changelog"]

[workspace.dependencies]
# C++20 bridge bindings for the default feature.
# consumers:
# - moveref
cxx = { version = "1.0", default-features = false, features = ["std"] }
# Deterministic hasher exercised by the library tests.
# consumers:
# - moveref
seahash = { version = "4.1", default-features = false }
# Deserialize CI events and local review metadata for the release-note tool.
# consumers:
# - moveref-changelog
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
# Parse GitHub event and CLI JSON for the release-note tool.
# consumers:
# - moveref-changelog
serde_json = { version = "1.0", default-features = false, features = ["std"] }
# Optional instrumentation for the debug feature.
# consumers:
# - moveref
tracing = { version = "0.1", default-features = false, features = ["attributes"] }

[workspace.lints.clippy]
# all = { correctness, suspicious, style, complexity, perf }
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# nursery
missing_const_for_fn = "allow"
useless_let_if_seq = "allow"

# pedantic
similar_names = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"

# style
needless_raw_string_hashes = "allow"
needless_return = "allow"

# restriction
alloc_instead_of_core = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
as_pointer_underscore = "deny"
# Wire fields use explicit little-endian conversions, keeping bytes identical
# across host and target byte orders. Host-local byte views for checksums or
# caches use the same conversions instead of `to_ne_bytes` / `from_ne_bytes`;
# this can require a byte swap on a big-endian host.
# Reversal: a required external byte contract specifies big-endian or native
# byte order; revisit `big_endian_bytes` or `host_endian_bytes` respectively.
big_endian_bytes = "deny"
cfg_not_test = "deny"
clone_on_ref_ptr = "deny"
create_dir = "deny"
dbg_macro = "deny"
decimal_literal_representation = "deny"
default_numeric_fallback = "deny"
default_union_representation = "deny"
deref_by_slicing = "deny"
disallowed_script_idents = "deny"
doc_include_without_cfg = "deny"
doc_paragraphs_missing_punctuation = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
error_impl_error = "deny"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
exit = "deny"
expect_used = "deny"
field_scoped_visibility_modifiers = "deny"
filetype_is_file = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
host_endian_bytes = "deny"
if_then_some_else_none = "deny"
impl_trait_in_params = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
inline_trait_bounds = "deny"
integer_division = "deny"
iter_over_hash_type = "deny"
large_include_file = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
map_with_unused_argument_over_ranges = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
missing_asserts_for_indexing = "deny"
missing_docs_in_private_items = "deny"
missing_inline_in_public_items = "deny"
mixed_read_write_in_expression = "deny"
mod_module_files = "deny"
# module_name_repetitions = "deny"
multiple_unsafe_ops_per_block = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
non_zero_suggestions = "deny"
panic = "deny"
pathbuf_init_then_push = "deny"
pattern_type_mismatch = "deny"
precedence_bits = "deny"
print_stderr = "deny"
print_stdout = "deny"
# pub_use = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_test_prefix = "deny"
redundant_type_annotations = "deny"
renamed_function_params = "deny"
return_and_then = "deny"
same_name_method = "deny"
# The semicolon ruling (owner, 2026-09-27): a block statement keeps its
# semicolon inside the block. `semicolon_outside_block` together with the
# pedantic `semicolon_if_nothing_returned` leaves a multi-line block statement
# whose value is unit with no legal form, and rustfmt produces that form
# whenever the block's expression does not fit one line. The inside form is the
# one fixed point both lints and rustfmt agree on.
semicolon_inside_block = "deny"
# The shadowing ruling (owner, 2026-09-03): shadowing is preferred without
# exception, so all three shadow lints stay off in every managed project.
# `shadow_unrelated` and `shadow_reuse` misfire in practice; `shadow_same` bars
# only rebinding a value to itself, which the preference permits, so it is off
# too. `shadow_reuse` is absent rather than commented because clippy allows it
# by default. This ruling overrides the wall where they conflict. Reversal: the
# owner withdraws the preference, and all three return together with the
# re-binding rule in `docs/agents/rust.md` §Style that names them.
# shadow_same = "deny"
# shadow_unrelated = "deny"
# single_call_fn = "deny"
single_char_lifetime_names = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
str_to_string = "deny"
string_add = "deny"
string_lit_chars_any = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
tests_outside_test_module = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_safety_comment = "deny"
unnecessary_self_imports = "deny"
unreachable = "deny"
unused_result_ok = "deny"
unused_trait_names = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
use_debug = "deny"
verbose_file_reads = "deny"

[workspace.lints.rust]
deprecated-safe = "deny"
future-incompatible = "deny"
keyword-idents = "deny"
let-underscore = "deny"
nonstandard-style = "deny"
refining-impl-trait = "deny"
rust-2018-compatibility = "deny"
rust-2018-idioms = "deny"
rust-2021-compatibility = "deny"
rust-2024-compatibility = "deny"
# No Dylint driver sets custom cfg values in this workspace.
unexpected_cfgs = "deny"
unknown-or-malformed-diagnostic-attributes = "deny"
# Nightly-creep guard: consumer crates have no feature exemption. A library
# producer scopes its rustc_private expectation to the compiler-plugin crate.
unstable_features = "deny"
unused = "deny"
warnings = "deny"

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
# Module and item docs intentionally cross-link to private implementation items;
# docs are always built with `--document-private-items` (the `cargo:doc` task),
# so those targets resolve. Without this allow, the public-doc-links-to-private
# lint would reject the project's deliberate "link to the internals" doc style.
private_intra_doc_links = "allow"

[dependencies]
cxx = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
seahash = { workspace = true }

[features]
default = ["cxx", "std"]
alloc = []
cxx = ["cxx/c++20"]
debug = ["tracing"]
std = ["alloc", "tracing/std"]
valgrind = []

[lints]
workspace = true
