#:tombi toml-version = "v1.1.0"
#:schema https://www.schemastore.org/prek.json

fail_fast = false
default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "prek-validate-config"
name = "prek validate-config"
language = "system"
entry = "mise exec -- prek validate-config prek.toml"
files.glob = ["prek.toml", "mise.toml", "mise.lock"]
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "conflict-markers"
name = "conflict-marker check"
language = "system"
entry = "mise run check:conflict-markers"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

# delta: the hooks here are the shared floor — config validation, conflict
# markers, formatting, and the commit message. A repository adds its own tier
# beside them (a private-path refusal, a push-identity guard, a
# prepare-commit-msg hook) and declares each addition in the page that owns its
# workflow.

[[repos.hooks]]
id = "treefmt-check"
name = "treefmt --fail-on-change"
language = "system"
entry = "mise run treefmt:check"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "commitlint"
name = "commitlint"
entry = "mise x -- commitlint --edit"
language = "system"
stages = ["commit-msg"]
always_run = true
pass_filenames = true

# delta: `default_install_hook_types` lists only the stages the shared hooks use.
# A repository adding a `prepare-commit-msg` or `pre-push` hook adds that stage
# to the list in the same change.
