#:tombi toml-version = "v1.1.0"

# Published tags include v0.0.2 and v1.0.0; preserve older, non-Conventional
# subjects under Legacy rather than rewriting release history.
[changelog]
header = """# Changelog

All notable changes to moveref are documented here.
"""
body = """{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
{% if group == "<!-- 00 -->Release Summaries" %}\
{% for commit in commits %}{% if commit.body %}
{{ commit.body | split(pat="Role:") | first | trim }}
{% endif %}{% endfor %}\
{% else %}\
### {% if version %}{{ version | trim_start_matches(pat="v") }} {% else %}Unreleased {% endif %}{{ group | striptags | trim | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}_({{ commit.scope }})_ {% endif %}{{ commit.message | upper_first }}
{% endfor %}\
{% endif %}\
{% endfor %}
"""
trim = false
render_always = true
footer = "<!-- Generated by git-cliff; edit the commits and tags, not this file. -->"

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
filter_commits = true
fail_on_unmatched_commit = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(?:-rc\\.[0-9]+)?$"
ignore_tags = ".*-rc\\.[0-9]+$"
protect_breaking_commits = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false
commit_preprocessors = []
commit_parsers = [
  { message = "^chore\\(repo\\): release", group = "<!-- 00 -->Release Summaries" },
  { message = "^feat", group = "<!-- 01 -->Features" },
  { message = "^fix", group = "<!-- 02 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 03 -->Performance" },
  { message = "^refactor", group = "<!-- 04 -->Refactoring" },
  { message = "^docs", group = "<!-- 05 -->Documentation" },
  { message = "^test", group = "<!-- 06 -->Testing" },
  { message = "^build", group = "<!-- 07 -->Build" },
  { message = "^ci", group = "<!-- 08 -->Continuous Integration" },
  { message = "^config", group = "<!-- 09 -->Configuration" },
  { message = "^style", group = "<!-- 10 -->Style" },
  { message = "^chore", group = "<!-- 11 -->Maintenance" },
  { message = "^revert", group = "<!-- 12 -->Reverts" },
  { message = ".*", group = "<!-- 13 -->Legacy" },
]
link_parsers = []
